name: Release

# Releases are created by pushing a version tag:  git tag v1.2.3 && git push origin v1.2.3
# The tag is the single source of truth: it becomes the Maven version (-Drevision), the jar's
# manifest Implementation-Version and the GitHub release name.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Anything with a hyphen (1.2.3-rc.1, 1.2.3-beta.2) is a pre-release.
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp -Drevision=${{ steps.v.outputs.version }} -pl appserver-deployment -am verify

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp appserver-deployment/target/appserver-deployment-extension.jar \
             "dist/appserver-deployment-extension-${{ steps.v.outputs.version }}.jar"
          cd dist && sha256sum *.jar > SHA256SUMS

      - name: Verify jar version
        run: |
          unzip -p dist/*.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -x "Implementation-Version: ${{ steps.v.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/SHA256SUMS
