# Everything goes to iyzitrace:
#   traces, logs   OTLP from the agents, unchanged (one service.name per server)
#   metrics        OTLP from the agents (jvm.*, http.*) + WildFly's /metrics endpoint (prometheus/wildfly)
#   metrics/host   CPU, memory, disk, filesystem, network, load, paging, processes of the host (host_metrics)
#
# Written for a collector on the Red Hat Enterprise Linux host that runs WildFly (otelcol-contrib RPM,
# /etc/otelcol-contrib/config.yaml), and used as-is by the lab's container.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # WildFly's management-model statistics in Prometheus format, on the management interface
  # (http://<host>:9990/metrics, no login by default). Covers every subsystem with
  # statistics-enabled=true: datasources, undertow, ejb3, transactions, jca, ee, io, batch.
  # The job name becomes service.name and the instance label service.instance.id. Both are set to
  # the agent's values (otel.service.name, service.instance.id in otel.resource.attributes), so the
  # scraped metrics and the agent's metrics and traces of this server share one identity.
  prometheus/wildfly:
    config:
      scrape_configs:
        - job_name: ${env:WILDFLY_SERVICE_NAME}
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["wildfly:9990"]   # the lab container; on the WildFly host itself: localhost:9990
              labels:
                # instance would default to the target (wildfly:9990); use the agent's service.instance.id.
                instance: ${env:WILDFLY_INSTANCE_ID}
          metric_relabel_configs:
            # base_* and vendor_* are JVM metrics; the agent already sends them as jvm.*.
            - source_labels: [__name__]
              regex: "(base|vendor)_.*"
              action: drop

  # Host metrics, read from /proc and /sys. Directly on RHEL: no root_path. In a container: mount the
  # host's / at /hostfs (read-only) and set HOSTMETRICS_ROOT_PATH=/hostfs; without it the container
  # reports the host's CPU, memory and load, but its own filesystems and network interfaces.
  host_metrics:
    collection_interval: 15s
    root_path: ${env:HOSTMETRICS_ROOT_PATH:-}
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load: {}
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      paging: {}
      processes: {}
      disk:
        # loop devices and RAM disks are not real disks
        exclude:
          devices: ["^(loop|ram)\\d+$"]
          match_type: regexp
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        # Only real filesystems (RHEL: xfs, ext4, vfat for /boot/efi), not kernel and container mounts.
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs,
                     fusectl, hugetlbfs, mqueue, nsfs, overlay, proc, pstore, rpc_pipefs, securityfs,
                     selinuxfs, squashfs, sysfs, tmpfs, tracefs]
          match_type: strict
        exclude_mount_points:
          mount_points: ["^/(dev|proc|sys|run)($|/)", "^/var/lib/(containers|docker)/"]
          match_type: regexp
      network:
        # loopback and container / VM virtual interfaces
        exclude:
          interfaces: ["^(lo|veth.*|docker\\d+|cni\\d+|podman\\d+|virbr\\d+)$"]
          match_type: regexp

processors:
  batch: {}

  # The prometheus receiver derives server.address / server.port from the instance label, which is
  # set to the instance id (wildfly-1), giving server.address=wildfly-1 and an empty port. Remove them;
  # the agent's metrics never carry them on the resource.
  resource/scrape-target:
    attributes:
      - key: server.address
        action: delete
      - key: server.port
        action: delete

  # host_metrics has no resource attributes of its own: add host.name and os.type, so the host
  # metrics can be matched with the agent's data from the same host (the agent sets host.name too).
  resource_detection/host:
    detectors: [env, system]
    system:
      hostname_sources: [os]

  # Optional, for traces: one service.name per application instead of per server. Add
  # groupbyattrs/deployment and transform/deployment-as-service (in that order, before batch) to the
  # traces pipeline. Rules: appserver-deployment/README.md, section 7.
  groupbyattrs/deployment:
    keys:
      - appserver.deployment.name
      - appserver.deployment.context_root
      - appserver.deployment.service.name
      - appserver.deployment.service.namespace

  # service.name, first match wins:
  #   1. otel.service.name the deployment declares in microprofile-config.properties
  #   2. context root without the leading slash (/orders -> orders)
  #   3. deployment name (timers, deploy-time work, MDBs, root context "/")
  # service.namespace: the declared namespace, else the server-wide service.name (wildfly-27-lab, tomcat-10-lab, ...).
  # Statements run in order, so the later ones override the earlier ones.
  transform/deployment-as-service:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["service.namespace"], attributes["service.name"]) where attributes["appserver.deployment.name"] != nil
          - set(attributes["service.name"], attributes["appserver.deployment.name"]) where attributes["appserver.deployment.name"] != nil
          - set(attributes["service.name"], attributes["appserver.deployment.context_root"]) where attributes["appserver.deployment.context_root"] != nil and attributes["appserver.deployment.context_root"] != "/"
          - replace_pattern(attributes["service.name"], "^/", "") where attributes["appserver.deployment.context_root"] != nil and attributes["appserver.deployment.context_root"] != "/"
          - set(attributes["service.name"], attributes["appserver.deployment.service.name"]) where attributes["appserver.deployment.service.name"] != nil
          - set(attributes["service.namespace"], attributes["appserver.deployment.service.namespace"]) where attributes["appserver.deployment.service.namespace"] != nil

exporters:
  otlp_http/iyzitrace:
    endpoint: ${env:IYZITRACE_OTLP_ENDPOINT}
    compression: none
    headers:
      iyzitrace-api-key: ${env:IYZITRACE_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/iyzitrace]
    metrics:
      receivers: [otlp, prometheus/wildfly]
      processors: [resource/scrape-target, batch]
      exporters: [otlp_http/iyzitrace]
    metrics/host:
      receivers: [host_metrics]
      processors: [resource_detection/host, batch]
      exporters: [otlp_http/iyzitrace]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/iyzitrace]
