  #   environment:
  #     JAVA_OPTS: >-
  #       -javaagent:/opt/opentelemetry-javaagent.jar
  #       -Dotel.javaagent.extensions=/opt/otel/extensions/appserver-deployment-extension.jar
  #       -Dotel.instrumentation.appserver-deployment.enabled=${DEPLOYMENT_EXTENSION_ENABLED:-true}
  #       -Dotel.service.name=tomcat-9-lab
  #       -Dotel.exporter.otlp.endpoint=${AGENT_OTLP_ENDPOINT:-http://otel-collector:4318}
  #       -Dotel.exporter.otlp.protocol=http/protobuf
  #       -Dotel.exporter.otlp.headers=${AGENT_OTLP_HEADERS:-}
  #       -Dotel.metric.export.interval=15000
  #   ports:
  #     - "${TOMCAT9_HTTP_PORT:-8092}:8080"
  #   depends_on:
  #     otel-collector:
  #       condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.159.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      IYZITRACE_OTLP_ENDPOINT: ${IYZITRACE_OTLP_ENDPOINT:-http://host.docker.internal:80/ingest/otlp}
      IYZITRACE_API_KEY: ${IYZITRACE_API_KEY:-}
      WILDFLY_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wildfly-27-lab}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  loadgen:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "/loadgen/traffic.sh"]
    environment:
      WILDFLY: http://wildfly:8080
      TOMCAT10: http://tomcat10:8080
      TOMCAT9: http://tomcat9:8080
      INTERVAL_SECONDS: ${LOADGEN_INTERVAL_SECONDS:-2}
    volumes:
      - ./loadgen:/loadgen:ro
    depends_on:
      wildfly:
        condition: service_healthy
      # tomcat10:
